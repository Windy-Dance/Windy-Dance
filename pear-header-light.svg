<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pear - glass header (light)</title>
  <desc id="desc">A liquid glass banner with the name Pear and a literary subtitle, on a warm cream background with soft sage, peach and violet glows.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="30" x2="1140" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDFBF7"/>
      <stop offset="0.5" stop-color="#F3EFE6"/>
      <stop offset="1" stop-color="#EFE9DC"/>
    </linearGradient>
    <radialGradient id="sageGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 110) rotate(40) scale(380 260)">
      <stop stop-color="#A8C5B0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#A8C5B0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="peachGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1030 320) rotate(220) scale(360 260)">
      <stop stop-color="#F0C9A0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#E8B7C0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 60) rotate(140) scale(280 220)">
      <stop stop-color="#C6B8E0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#C6B8E0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="300" y1="70" x2="900" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.92"/>
      <stop offset="0.45" stop-color="white" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F5F1E8" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="300" y1="70" x2="900" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="white" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#D8CDB8" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="blur40" x="-100" y="-100" width="1400" height="600" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur18" x="-100" y="-100" width="1400" height="600" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="60" y="10" width="1080" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#5C4A30" flood-opacity="0.18"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.03"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="panelClip">
      <rect x="96" y="52" width="1008" height="300" rx="40"/>
    </clipPath>
  </defs>

  <rect width="1200" height="400" rx="36" fill="url(#bg)"/>
  <circle cx="200" cy="110" r="250" fill="url(#sageGlow)" filter="url(#blur40)"/>
  <circle cx="1030" cy="330" r="260" fill="url(#peachGlow)" filter="url(#blur40)"/>
  <circle cx="900" cy="60" r="200" fill="url(#violetGlow)" filter="url(#blur40)"/>
  <path d="M-20 300C180 220 250 350 420 290C600 240 650 120 850 170C1010 200 1090 150 1220 90" stroke="#6B9A7E" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M-30 330C160 250 280 390 455 330C650 270 695 150 880 200C1040 235 1120 180 1220 130" stroke="#B08A55" stroke-opacity="0.16" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="88" y="44" width="1024" height="316" rx="48" fill="white" fill-opacity="0.6"/>
    <rect x="88.75" y="44.75" width="1022.5" height="314.5" rx="47.25" stroke="#C9BCA3" stroke-opacity="0.3"/>
    <rect x="96" y="52" width="1008" height="300" rx="40" fill="url(#glass)"/>
    <rect x="96.75" y="52.75" width="1006.5" height="298.5" rx="39.25" stroke="url(#glassEdge)" stroke-opacity="0.95" stroke-width="1.5"/>
  </g>
  <rect x="96" y="52" width="1008" height="300" rx="40" fill="white" fill-opacity="0.4" filter="url(#grain)"/>

  <g clip-path="url(#panelClip)">
    <circle cx="240" cy="90" r="120" fill="#A8C5B0" fill-opacity="0.35" filter="url(#blur18)"/>
    <circle cx="900" cy="320" r="130" fill="#E8B7C0" fill-opacity="0.28" filter="url(#blur18)"/>
  </g>

  <!-- eyebrow -->
  <text x="140" y="150" fill="#6B9A7E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="3">CS SOPHOMORE / WINDY-DANCE</text>

  <!-- name -->
  <text x="140" y="242" fill="#2B2620" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="600" letter-spacing="1">Pear</text>
  <!-- subtitle -->
  <text x="144" y="300" fill="#5B8A6B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="28" font-weight="600">pear compiling...</text>
  <rect x="452" y="272" width="4" height="32" fill="#5B8A6B" fill-opacity="0.9"/>
</svg>